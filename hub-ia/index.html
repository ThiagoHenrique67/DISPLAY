<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub-IA</title>
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* estilo base - mobile */
        body{
            padding: 20px;
            background-color: olive;
            color: aliceblue;
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        .conteiner{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
        }
        


/* Base style for mobile devices */
body {
  background-color: olive;
  color: white;
}

/* For devices with a minimum width of 768px (Medium) */
@media screen and (min-width: 768px) {
  body {
    background-color: blue;
    color: white;
  }
}

/* For devices with a minimum width of 992px (Large) */
@media screen and (min-width: 992px) {
  body {
    background-color: tan;
    color: black;
  }
}
    
    </style>
    
</head>
<body>
    <h1>isto é um teste de @media</h1>
    
    <div class="conteiner">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
    </html>
